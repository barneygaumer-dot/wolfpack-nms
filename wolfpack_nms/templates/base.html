<!doctype html><html><head><meta charset="utf-8"><title>WolfPack NMS</title><style>
body{font-family:system-ui;background:#101010;color:#eee;margin:0}header{padding:16px 26px;background:#181818;border-bottom:1px solid #333}nav{display:flex;gap:8px;padding:10px 24px;background:#151515}nav a{color:#ccc;text-decoration:none;padding:9px 14px;border-radius:6px}nav a.active,nav a:hover{background:#303030;color:white}main{padding:22px;max-width:1400px;margin:auto}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(290px,1fr));gap:16px}.card{background:#1b1b1b;border:1px solid #333;border-radius:10px;padding:18px;margin-bottom:16px}table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:8px;border-bottom:1px solid #333}a{color:#8ab4f8}.UP,.PASS{color:#6ee787}.DOWN,.FAIL{color:#ff7b72}input,select,textarea,button{padding:9px;margin:3px;background:#222;color:#eee;border:1px solid #555;border-radius:5px}textarea{width:95%;min-height:90px}.field{display:grid;grid-template-columns:170px 1fr;align-items:center;margin:7px}.field input,.field select{width:90%}.flash{padding:10px;background:#282828;margin-bottom:10px}.small{color:#aaa;font-size:.9em}.node{display:inline-block;padding:14px;margin:10px;border:2px solid #555;border-radius:12px;min-width:150px;text-align:center}.node.UP{border-color:#6ee787}.node.DOWN{border-color:#ff7b72}</style></head><body>
